<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %} {% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body class="d-flex g-2">

    <!-- Sidebar Start -->
    {% if user.is_authenticated %}
    <aside class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark shadow" style="width: 280px; height: 100vh ">
      <span class="fs-4 text-center mb-3">Shopping Nepal</span>
      <hr />
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="{% url 'dashboard' %}" class="nav-link text-center text-white active">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="{% url 'product' %}" class="nav-link text-white text-center">
            <i class="bi bi-box-seam me-1"></i> Products
          </a>
        </li>
        <li>
          <a href="{% url 'add_product' %}" class="nav-link text-white text-center">
            <i class="bi bi-plus-square me-1"></i> Add Product
          </a>
        </li>
        <li>
          <a href="{% url 'category' %}" class="nav-link text-white text-center">
            <i class="bi bi-tags me-1"></i> Category
          </a>
        </li>
        <li>
          <a href="{% url 'add_category' %}" class="nav-link text-white text-center">
            <i class="bi bi-plus-circle me-1"></i> Add Category
          </a>
        </li>
        <li>
          <a href="{% url 'customers' %}" class="nav-link text-white text-center">
            <i class="bi bi-people me-1"></i> Customers
          </a>
        </li>
        <li>
          <a href="{% url 'order_status' %}" class="nav-link text-white text-center">
            <i class="bi bi-cart-check me-1"></i> Orders
          </a>
        </li>
      </ul>
      <hr />
      <a href="{% url 'logout' %}" class="btn btn-warning w-100 mb-3">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </a>
      <div class="dropdown text-center">
        <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2" />
        <strong>Admin</strong>
      </div>
    </aside>
    {% endif %}
    <!-- Sidebar End -->

    <!-- Main Content Start -->
    <div class="container-fluid p-4">
      {% block content %}
      {% endblock %}
    </div>
    <!-- Main Content End -->

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let navLinks = document.querySelectorAll(".nav-link");
        let currentUrl = window.location.href;
        navLinks.forEach((link) => {
          if (link.href === currentUrl) {
            link.classList.add("active");
          } else {
            link.classList.remove("active");
          }
        });
      });
    </script>
  </body>
</html>
