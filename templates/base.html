<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %} {% endblock %}</title>

    <!-- bootstrap css cdn link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex g-2">
      <!-- sidebar start  -->
      {% if user.is_authenticated %}
        <aside
        class="d-flex flex-column  flex-shrink-0 p-3 text-bg-dark shadow"
        style="width: 280px; height: 100vh"
      >
        <span class="fs-4 text-center">ONLine Shop</span>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="{% url 'dashboard' %}" class="nav-link text-center text-white active" aria-current="page">
              Dashboard
            </a>
          </li>
          <li>
            <a href="{% url 'product' %}" class="nav-link text-white text-center"> Products </a>
          </li>
          <li>
            <a href="{% url 'add_product' %}" class="nav-link text-white text-center">
              Add Product
            </a>
          </li>
          <li>
            <a href="{% url 'category' %}" class="nav-link text-white text-center"> Category </a>
          </li>
          <li>
            <a href="{% url 'add_category' %}" class="nav-link text-white text-center">
              Add Category
            </a>
          </li>
          <li>
            <a href="#" class="nav-link text-white text-center"> Customers </a>
          </li>
          <li>
            <a href="#" class="nav-link text-white text-center"> Orders </a>
          </li>
        </ul>
        <a href="{% url 'logout' %}" class="btn btn-warning">Logout</a>
        <hr />
        <div class="dropdown">
          <img
            src="https://github.com/mdo.png"
            alt=""
            width="32"
            height="32"
            class="rounded-circle me-2"
          />
          <strong>Admin</strong>
        </div>
    </aside>
    {% endif %}

    <!-- sidebar end  -->
     <!-- main content start  -->
      <div  class="container-fluid">
        {% block content %}

        {% endblock %}
    </div>    
    <!-- main content end     -->

    <!-- bootstrap js cdn link  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
          let navLinks = document.querySelectorAll(".nav-link");
          let currentUrl = window.location.href;
  
          navLinks.forEach((link) => {
            if (link.href === currentUrl) {
              link.classList.add("active");
            }else{
                link.classList.remove("active");
            }
          });
        });
    </script>
  </body>
</html>
