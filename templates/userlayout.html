<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %} {% endblock %}</title>

    <!-- bootstrap css cdn link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      .hover-nav:hover {
        color: #0dcaf0 !important;
      }
    </style>
  </head>

  <body>

    <!--Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
      <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'homepage' %}">
          <i class="bi bi-bag-check-fill fs-4"></i>
          Shopping Nepal
        </a>

        <!-- Mobile menu -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navMenu">

          <ul class="navbar-nav me-auto ms-3 gap-2">

            <li class="nav-item">
              <a class="nav-link text-white fw-semibold hover-nav" href="{% url 'all-products' %}">
                <i class="bi bi-box-seam"></i> Products
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white fw-semibold hover-nav" href="{% url 'show_cart_items' %}">
                <i class="bi bi-cart3"></i> Cart
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-white fw-semibold hover-nav" href="{% url 'order_history' %}">
                <i class="bi bi-receipt"></i> Order History
              </a>
            </li>
          </ul>

          <!-- Search -->
          <form class="d-flex me-3" role="search">
            <input class="form-control" type="search" placeholder="Search products..." />
          </form>

          <!-- Auth Buttons -->
          <div class="d-flex gap-2">
            {% if user.is_authenticated %}
              <a href="{% url 'logout' %}" class="btn btn-outline-warning">
                <i class="bi bi-box-arrow-right"></i> Logout
              </a>
            {% else %}
              <a href="{% url 'login' %}" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Login
              </a>
              <a href="{% url 'register' %}" class="btn btn-light">
                <i class="bi bi-person-plus"></i> Register
              </a>
            {% endif %}
          </div>

        </div>
      </div>
    </nav>
    <!--  Navbar End -->


    {% block content %}
    <!-- carousel start -->
    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="..." class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
          <img src="..." class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
          <img src="..." class="d-block w-100" alt="...">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <!-- carousel end -->
    {% endblock %}

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
