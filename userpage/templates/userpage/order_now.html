{% extends 'userlayout.html' %}
{% load crispy_forms_tags %}

{% block title %}
Order Now
{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="d-flex justify-content-center">

        <div class="col-md-5 shadow-lg p-4 rounded bg-white">

            <h2 class="text-center text-muted mb-4">Order Now</h2>

            <!-- Product Info -->
            <div class="d-flex gap-4 align-items-center mb-4">
                
                <div style="height:150px; width:150px; flex-shrink: 0;">
                    <img src="{{ product_image.url }}" 
                         alt="{{ product_name }}" 
                         class="rounded img-fluid" 
                         style="object-fit: cover; height: 150px; width: 150px;">
                </div>

                <div>
                    <h5 class="fw-semibold">{{ product_name }}</h5>
                    <p class="text-success fw-bold">Rs {{ price }}</p>
                </div>
            </div>

            <!-- Order Form -->
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-end gap-3 mt-3">
                    <input class="btn btn-primary" type="submit" value="Confirm Order">
                    <a href="{% url 'show_cart_items' %}" class="btn btn-outline-danger">Cancel Order</a>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
