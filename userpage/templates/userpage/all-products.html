{% extends 'userlayout.html' %}
{% load static %}
{% block title%}
Products
{% endblock %}

{% block content %}

<!-- latestproduct -->
 <div class="'container-fluid p-4">
    <h3 class="text-muted my-2 text-center">All Products</h3>
 </div>
 <div class="row row-cols-1 row-cols-md-4 g-4">
  {% for items in products %}
  <div class="col">
    
    <div class="card">
      <img src="{{items.image.url}}" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">{{items.product_name}}</h5>
        <p class="card-text">{{items.description}}</p>
        <a href="{% url 'product_detial' items.id %}" class="btn btn-warning">Veiw Detials</a>
      </div>
    </div>
    
  </div>
  {% endfor %}
</div>
 <!-- latestproduct end -->
{% endblock %}
