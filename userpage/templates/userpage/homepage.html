{% extends 'userlayout.html' %}
{% load static %}
{% block title%}
Homepage
{% endblock %}

{% block content %}
 <!-- carousel start -->
         <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{% static 'images/Women.jpg' %}" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/playtime.jpg' %}" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/laptop.jpg' %}" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
         <!-- carousel end -->

<!-- latestproduct -->
 <div class="'container-fluid p-4">
    <h3 class="text-muted my-2">Latest Product</h3>
 </div>
 <div class="row row-cols-1 row-cols-md-4 g-4">
  {% for items in products %}
  <div class="col">
    
    <div class="card">
      <img src="{{items.image.url}}" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">{{items.product_name}}</h5>
        <p class="card-text">{{items.description}}</p>
        <a href="{% url 'product_detial' items.id %}" class="btn btn-warning">Veiw Detials</a>
      </div>
    </div>
    
  </div>
  {% endfor %}
</div>
 <!-- latestproduct end -->
{% endblock %}
