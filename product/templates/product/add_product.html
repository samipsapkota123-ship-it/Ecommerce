{% extends 'base.html' %}
{% load crispy_forms_tags %}



{% block title %}
Admin || Edit-Product
{% endblock %}

{% block content %}
    <div class="container">
        <h1 class="text-center text-muted mt-2">Add Product</h1>
        <div class="d-flex justify-content-center">
            <div class="col-md-5 shadow-lg p-3">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{form|crispy}}
                <input class="btn btn-primary mt-2" type="submit" value="Add Product" Product">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
