{% extends 'base.html' %}

{% block title %} Customers {% endblock %}

{% block content %}
<div class="container-fluid m-xl-2">
    <h1 class="text-center text-muted mt-4">All Customers</h1>

    <table class="table table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Date Joined</th>
            </tr>
        </thead>
        <tbody>
            {% for user in customers %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.date_joined}}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="6" class="text-center">No customers found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
